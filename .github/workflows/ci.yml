name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bring up the dev office
        run: bin/office dev init --name ci

      - name: Integration tests
        run: npm run test:integration

      - name: Dump container logs
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}' | grep '^agentcy-'); do
            echo "::group::$c"
            docker logs --tail 200 "$c" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: bin/office dev down --purge

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
    steps:
      - name: Skip notice
        if: env.OPENCODE_GO_API_KEY == ''
        run: echo "::notice::OPENCODE_GO_API_KEY secret is not set (forks, or not configured), end-to-end test skipped"

      - uses: actions/checkout@v4
        if: env.OPENCODE_GO_API_KEY != ''

      - name: Use Node.js 22
        if: env.OPENCODE_GO_API_KEY != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tmux and opencode
        if: env.OPENCODE_GO_API_KEY != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          npm i -g opencode-ai

      - name: Install dependencies
        if: env.OPENCODE_GO_API_KEY != ''
        run: npm ci

      - name: Bring up the dev office
        if: env.OPENCODE_GO_API_KEY != ''
        run: bin/office dev init --name ci

      - name: End-to-end test
        if: env.OPENCODE_GO_API_KEY != ''
        run: npm run test:e2e

      - name: Dump diagnostics
        if: failure() && env.OPENCODE_GO_API_KEY != ''
        run: |
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}' | grep '^agentcy-'); do
            echo "::group::$c"
            docker logs --tail 200 "$c" 2>&1 || true
            echo "::endgroup::"
          done
          for s in $(tmux list-sessions -F '#{session_name}' 2>/dev/null | grep '^office-'); do
            for w in $(tmux list-windows -t "$s" -F '#{window_name}' 2>/dev/null); do
              echo "::group::tmux $s:$w"
              tmux capture-pane -p -t "$s:$w" -S -200 2>&1 || true
              echo "::endgroup::"
            done
          done
          for f in state/agents/*/mcp.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -n 200 "$f" || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always() && env.OPENCODE_GO_API_KEY != ''
        run: bin/office dev down --purge
